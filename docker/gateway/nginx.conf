# API gateway + SPA. Callers: docker/frontend/Dockerfile COPY
# User: deploy pure stack on local docker
upstream login_svc { server login:8080; }
upstream fileupload_svc { server fileupload:8081; }
upstream fi_svc { server fi:8082; }
upstream um_svc { server um:8083; }
upstream txn_svc { server transactions:8084; }

server {
    listen 80;
    client_max_body_size 100m;

    location /js-hr-login/ {
        proxy_pass http://login_svc/js-hr-login/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /js_hr_fileupload/ {
        proxy_pass http://fileupload_svc/js_hr_fileupload/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 200m;
    }

    location /js-hr-fi/ {
        proxy_pass http://fi_svc/js-hr-fi/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /js_hr_um/ {
        proxy_pass http://um_svc/js_hr_um/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /js_hr_transactions/ {
        proxy_pass http://txn_svc/js_hr_transactions/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
