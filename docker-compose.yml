# Full local Home Remittance stack
# Callers: docker compose up -d --build
# User instruction: deploy pure stack on local docker
#
# UI + API gateway: http://localhost
# Oracle JDBC: jdbc:oracle:thin:@localhost:1521/FREEPDB1  (JS_HOMEREMIT / hr)
# Direct service ports: 8080-8084 (optional); LDAP mock: 8089

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: home_remit_oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: OraclePassword123
      APP_USER: JS_HOMEREMIT
      APP_USER_PASSWORD: hr
    volumes:
      - home_remit_oracle_data:/opt/oracle/oradata
      - ./db/oracle:/opt/homeremit-sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  ldap-mock:
    build:
      context: ./docker/ldap-mock
    container_name: home_remit_ldap
    ports:
      - "8089:8089"

  login:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_DIR: HomeRemmitance/JS_HR_Login
    container_name: home_remit_login
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    volumes:
      - home_remit_tmp:/tmp/homeremit
    depends_on:
      oracle:
        condition: service_healthy
      ldap-mock:
        condition: service_started

  fileupload:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_DIR: HomeRemmitance/JS_HR_File_Upload
    container_name: home_remit_fileupload
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    volumes:
      - home_remit_tmp:/tmp/homeremit
    depends_on:
      oracle:
        condition: service_healthy

  fi:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_DIR: HomeRemmitance/JS_HR_FinancialInstitutions
    container_name: home_remit_fi
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      oracle:
        condition: service_healthy

  um:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_DIR: HomeRemmitance/JS_HR_User_Management
    container_name: home_remit_um
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      oracle:
        condition: service_healthy

  transactions:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        SERVICE_DIR: HomeRemmitance/JS_HR_Transaction_Process
    container_name: home_remit_txn
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    volumes:
      - home_remit_tmp:/tmp/homeremit
    depends_on:
      oracle:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: home_remit_frontend
    ports:
      - "80:80"
    depends_on:
      - login
      - fileupload
      - fi
      - um
      - transactions

volumes:
  home_remit_oracle_data:
  home_remit_tmp:
